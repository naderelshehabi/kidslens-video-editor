name: kidslens_video_editor
description: KidsLens - A desktop video editor for creating educational content for children
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  
  # Code Generation
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  
  # Native Interop
  ffi: ^2.1.0
  
  # HTTP
  http: ^1.2.0
  
  # Utilities
  path: ^1.8.0
  path_provider: ^2.1.0
  uuid: ^4.2.0
  file_picker: ^8.0.0
  collection: ^1.18.0
  equatable: ^2.0.5
  url_launcher: ^6.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/logos/
    - assets/wordlists/
    - assets/audio/

  fonts: []

flutter_launcher_icons:
  android: false
  ios: false
  windows:
    generate: true
    image_path: "assets/images/app_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app_logo.png"
  linux:
    generate: true
    image_path: "assets/images/app_logo.png"
