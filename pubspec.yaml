name: kidslens_video_editor
description: KidsLens - A desktop video editor for creating educational content for children
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  collection: ^1.18.0
  crypto: ^3.0.3
  equatable: ^2.0.5
  ffi: ^2.1.0
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  freezed_annotation: ^2.4.0
  http: ^1.2.0
  json_annotation: ^4.8.0
  media_kit: ^1.1.11
  media_kit_libs_video: ^1.0.5
  media_kit_video: ^1.2.5
  path: ^1.8.0
  path_provider: ^2.1.0
  riverpod_annotation: ^2.3.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  uuid: ^4.2.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.4.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.7.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/logos/
    - assets/wordlists/
    - assets/audio/

  fonts: []

flutter_launcher_icons:
  android: false
  ios: false
  windows:
    generate: true
    image_path: "assets/images/app_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app_logo.png"
  linux:
    generate: true
    image_path: "assets/images/app_logo.png"
